name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: primer-workflow design data/examples/input.csv -o results/ci_templates
      - run: primer-workflow design data/examples/genes.txt --reference data/examples/synthetic-genome.fa --gff data/examples/synthetic.gff3 --specificity exact -o results/ci_reference
